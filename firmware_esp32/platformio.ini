; ============================================================================
; Configuración PlatformIO para ESP32-WROOM-32 Rover (Bluetooth Classic SPP)
; ============================================================================
; Placa objetivo : ESP32 Dev Module (ESP32-WROOM-32)
; Framework      : Arduino sobre Espressif32
; Monitor Serial : 115200 baudios (útil para depuración por USB)
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad del puerto serie USB para depuración
monitor_speed = 115200
upload_speed = 921600

; Opciones de compilación para advertencias claras y depuración limpia
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
